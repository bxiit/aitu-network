# Production stack for the deploy host. The deploy workflow copies this file to
# $DEPLOY_PATH/compose.yml and writes $DEPLOY_PATH/.env with the variables used below.
# (Kept in deploy/ so it doesn't shadow docker-compose.yml, which is for local development.)
services:
  mongo-db:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: aituuser
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD is not set}
    volumes:
      - mongo_data:/data/db
    # The backend connects over the project network (mongo-db:27017). Port 27018 on the host is for
    # admin access (IntelliJ, mongosh) through an SSH tunnel; it's bound to 127.0.0.1 because Docker's
    # published ports bypass the host firewall.
    ports:
      - "127.0.0.1:27018:27017"

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    # the backend's WebSocket broker relay speaks STOMP, which RabbitMQ only serves with this plugin enabled
    command: sh -c "rabbitmq-plugins enable --offline rabbitmq_stomp && exec docker-entrypoint.sh rabbitmq-server"
    environment:
      RABBITMQ_DEFAULT_USER: aituuser
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is not set}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    # STOMP (61613) stays on the project network; the management UI is for admin access through an SSH tunnel
    ports:
      - "127.0.0.1:15672:15672"

  backend:
    image: ghcr.io/bxiit/aitu-network:${IMAGE_TAG:?IMAGE_TAG is not set}
    restart: unless-stopped
    depends_on:
      - mongo-db
      - rabbitmq
    environment:
      SPRING_PROFILES_ACTIVE: default
      # Overrides spring.data.mongodb.uri and token.key from application.yml
      SPRING_DATA_MONGODB_URI: mongodb://aituuser:${MONGO_PASSWORD}@mongo-db:27017/aitunetwork?authSource=admin
      TOKEN_KEY: ${TOKEN_KEY:?TOKEN_KEY is not set}
      MAIL_PASS: ${MAIL_PASS:-}
      STOMP_BROKER_HOST: rabbitmq
      STOMP_BROKER_LOGIN: aituuser
      STOMP_BROKER_PASSCODE: ${RABBITMQ_PASSWORD}
    ports:
      - "${HOST_PORT:?HOST_PORT is not set}:8080"
    networks:
      default:
      aitu-net:
        # the frontend container proxies /api and /ws to this name
        aliases:
          - aitu-backend

volumes:
  mongo_data:
  rabbitmq_data:

networks:
  # shared with the frontend stack; created by the deploy workflow
  aitu-net:
    external: true
