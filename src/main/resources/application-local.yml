spring:
  data:
    mongodb:
      auto-index-creation: true
      database: secureTalk
      uri: mongodb://aituuser:aitupass@localhost:27017/aitunetwork?authSource=admin
logging:
  level:
    org.springframework.web: debug
    org.springframework.data.mongodb: debug

secure-talk:
  mail-confirmation: ${MAIL_CONFIRMATION_ENABLED:false}
  stomp-broker:
    # the docker-compose RabbitMQ
    login: ${STOMP_BROKER_LOGIN:aituuser}
    passcode: ${STOMP_BROKER_PASSCODE:aitupass}
