spring:
  data:
    mongodb:
      auto-index-creation: true
      database: secureTalk
      uri: mongodb://aituuser:aitupass@localhost:27017/aitunetwork?authSource=admin
logging:
  level:
    org.springframework.web: debug
    org.springframework.data.mongodb: debug

secure-talk:
  mail-confirmation: ${MAIL_CONFIRMATION_ENABLED:false}
  stomp-broker:
    # in-memory simple broker locally; build with -Dlocal to leave out Reactor Netty
    enabled: false
