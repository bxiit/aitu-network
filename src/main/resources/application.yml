server:
  port: 8080
  error:
    include-message: always
  # Requests arrive through a proxy (the Next.js frontend, Caddy). Use its X-Forwarded-Host/Proto as the
  # request's own host, so browser calls through the proxy count as same-origin and need no CORS entry.
  forward-headers-strategy: framework
secure-talk:
  cors:
    # only for browsers calling the backend directly from another origin
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  # relative, so links work on whatever address the site is served from
  file-download-path: /api/v1/file/
  mail-confirmation: ${MAIL_CONFIRMATION_ENABLED:false}
  chat:
    user-destination: ${USER_WS_DESTINATION:/topic/messages}
  # External STOMP broker (RabbitMQ with the rabbitmq_stomp plugin) that the WebSocket broker relay forwards to
  stomp-broker:
    # false = in-memory simple broker (single instance only)
    enabled: ${STOMP_BROKER_ENABLED:true}
    host: ${STOMP_BROKER_HOST:localhost}
    port: ${STOMP_BROKER_PORT:61613}
    login: ${STOMP_BROKER_LOGIN:guest}
    passcode: ${STOMP_BROKER_PASSCODE:guest}
    virtual-host: ${STOMP_BROKER_VHOST:/}
spring:
  data:
    mongodb:
      auto-index-creation: true
      database: secureTalk
      uri: mongodb://aituuser:aitupass@mongo-db:27017/aitunetwork?authSource=admin
  profiles:
    active: local
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 30MB
  mail:
    host: "smtp.gmail.com"
    port: 587
    username: "reluckytryhrd@gmail.com"
    password: ${MAIL_PASS:xxxxxxxxxxx}
    properties:
      mail:
        transport:
          protocol: smtp
        smtp:
          auth: true
          starttls:
            enable: true
        debug: true
logging:
  level:
    org.springframework.security: info
token:
