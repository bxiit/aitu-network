services:
  redis:
    networks:
      - aitu-net
    image: redis:7.2
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always
  rabbitmq:
    networks:
      - aitu-net
    image: rabbitmq:4-management
    container_name: rabbitmq
    # the WebSocket broker relay speaks STOMP, which RabbitMQ only serves with this plugin enabled
    command: sh -c "rabbitmq-plugins enable --offline rabbitmq_stomp && exec docker-entrypoint.sh rabbitmq-server"
    ports:
      - "61613:61613" # STOMP
      - "15672:15672" # management UI
    environment:
      # not guest: RabbitMQ only lets guest connect from localhost, and the published port isn't that
      RABBITMQ_DEFAULT_USER: aituuser
      RABBITMQ_DEFAULT_PASS: aitupass
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: always
  mongodb:
    networks:
      - aitu-net
    image: mongo
    container_name: mongo-db
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: aituuser
      MONGO_INITDB_ROOT_PASSWORD: aitupass
    volumes:
      - mongo_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
volumes:
  mongo_data:
  redis_data:
  rabbitmq_data:

networks:
  aitu-net:
    driver: bridge
    name: aitu-net